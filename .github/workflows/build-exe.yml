name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Prepare PyInstaller spec and windowless frozen support
        shell: python
        run: |
          import pathlib, textwrap

          py_path = pathlib.Path("artex_console.py")
          src = py_path.read_text(encoding="utf-8")

          if "RESOURCE_DIR = getattr(sys," not in src:
              src = src.replace(
                  'HERE = os.path.dirname(os.path.abspath(__file__))',
                  'FROZEN = bool(getattr(sys, "frozen", False))\n'
                  'HERE = (os.path.dirname(os.path.abspath(sys.executable)) if FROZEN\n'
                  '        else os.path.dirname(os.path.abspath(__file__)))\n'
                  'RESOURCE_DIR = getattr(sys, "_MEIPASS", HERE)',
                  1,
              )
              src = src.replace(
                  'with open(os.path.join(HERE, "icon.ico"), "rb") as f:',
                  'with open(os.path.join(RESOURCE_DIR, "icon.ico"), "rb") as f:',
                  1,
              )

          if "/api/heartbeat" not in src:
              src = src.replace(
                  'async function boot(){',
                  'function boot(){\n'
                  '  if (!window._hbStarted){\n'
                  '    window._hbStarted = true;\n'
                  '    const hb = () => fetch("/api/heartbeat", {keepalive: true}).catch(() => {});\n'
                  '    hb();\n'
                  '    setInterval(hb, 2500);\n'
                  '  }\n'
                  '  return _boot();\n'
                  '}\n'
                  'async function _boot(){',
                  1,
              )
              src = src.replace(
                  "async function load(){try{fill(await api('/api/settings'))}catch(e){$('msg').textContent=T('req_fail')+e}}",
                  "async function load(){\n"
                  "  if (!window._hbStarted){\n"
                  "    window._hbStarted = true;\n"
                  "    const hb = () => fetch('/api/heartbeat', {keepalive: true}).catch(() => {});\n"
                  "    hb();\n"
                  "    setInterval(hb, 2500);\n"
                  "  }\n"
                  "  try{fill(await api('/api/settings'))}catch(e){$('msg').textContent=T('req_fail')+e}\n"
                  "}",
                  1,
              )
              src = src.replace(
                  'class Handler(BaseHTTPRequestHandler):\n'
                  '    cfg = None\n'
                  '    port = 0\n'
                  '    allowed_hosts = set()',
                  'class Handler(BaseHTTPRequestHandler):\n'
                  '    cfg = None\n'
                  '    port = 0\n'
                  '    allowed_hosts = set()\n'
                  '    last_heartbeat = 0.0\n'
                  '    ever_connected_ui = False',
                  1,
              )
              src = src.replace(
                  '    def do_GET(self):\n'
                  '        if not self._guard():\n'
                  '            return\n'
                  '        if self.path.startswith("/api/machines"):',
                  '    def do_GET(self):\n'
                  '        if not self._guard():\n'
                  '            return\n'
                  '        Handler.last_heartbeat = time.time()\n'
                  '        if self.path.startswith("/api/heartbeat"):\n'
                  '            Handler.ever_connected_ui = True\n'
                  '            self._json({"ok": True})\n'
                  '            return\n'
                  '        if self.path.startswith("/api/machines"):',
                  1,
              )
              src = src.replace(
                  '    def do_POST(self):\n'
                  '        if not self._guard():\n'
                  '            return\n'
                  '        try:',
                  '    def do_POST(self):\n'
                  '        if not self._guard():\n'
                  '            return\n'
                  '        Handler.last_heartbeat = time.time()\n'
                  '        try:',
                  1,
              )

          old_main_tail = '''    for s in (sys.stdout, sys.stderr):
                  try:
                      s.reconfigure(encoding="utf-8", errors="replace")
                  except Exception:
                      pass

              global _CONFIG_PATH
              _CONFIG_PATH = os.path.abspath(args.config)
              cfg = load_config(args.config)
              apply_export_dir(cfg)
              Handler.cfg = cfg
              port = args.port or int(cfg["console"].get("port", 8900))

              print("ARTEX Controller：%d 台主机（%d 台已配置密码）"
                    % (len(cfg["machines"]), sum(1 for m in cfg["machines"] if m.get("ssh_password"))))
              print("页面地址： http://127.0.0.1:%d" % port)
              print("（每台点右上角开关建立常连接，连上后每 8 秒自动刷新；断开即释放）")

              Handler.port = port
              Handler.allowed_hosts = {"127.0.0.1:%d" % port, "localhost:%d" % port}
              srv = ThreadingHTTPServer(("127.0.0.1", port), Handler)
              srv.daemon_threads = True
              srv.request_queue_size = 8
              if not args.no_browser:
                  try:
                      w, h = [int(x) for x in str(args.window_size).lower().split("x")]
                  except Exception:
                      w, h = 1040, 780
                  threading.Timer(1.0, lambda: open_app_window("http://127.0.0.1:%d" % port, w, h)).start()
              try:
                  srv.serve_forever()
              except KeyboardInterrupt:
                  print("\\n已停止")'''
          old_main_tail = textwrap.dedent(old_main_tail)
          new_main_tail = '''    for s in (sys.stdout, sys.stderr):
                  try:
                      if s is not None:
                          s.reconfigure(encoding="utf-8", errors="replace")
                  except Exception:
                      pass
              if sys.stdout is None:
                  sys.stdout = open(os.devnull, "w", encoding="utf-8")
              if sys.stderr is None:
                  sys.stderr = open(os.devnull, "w", encoding="utf-8")

              global _CONFIG_PATH
              _CONFIG_PATH = os.path.abspath(args.config)
              if FROZEN and not os.path.isfile(_CONFIG_PATH):
                  example = os.path.join(RESOURCE_DIR, "config.example.toml")
                  if os.path.isfile(example):
                      shutil.copyfile(example, _CONFIG_PATH)
                      print("已生成配置文件：%s（可直接在界面里填写账号密码）" % _CONFIG_PATH)
              cfg = load_config(args.config)
              apply_export_dir(cfg)
              Handler.cfg = cfg
              port = args.port or int(cfg["console"].get("port", 8900))
              try:
                  w, h = [int(x) for x in str(args.window_size).lower().split("x")]
              except Exception:
                  w, h = 1040, 780
              url = "http://127.0.0.1:%d" % port

              print("ARTEX Controller：%d 台主机（%d 台已配置密码）"
                    % (len(cfg["machines"]), sum(1 for m in cfg["machines"] if m.get("ssh_password"))))
              print("页面地址： %s" % url)
              print("（每台点右上角开关建立常连接，连上后每 8 秒自动刷新；断开即释放）")

              Handler.port = port
              Handler.allowed_hosts = {"127.0.0.1:%d" % port, "localhost:%d" % port}
              Handler.last_heartbeat = time.time()
              try:
                  srv = ThreadingHTTPServer(("127.0.0.1", port), Handler)
              except OSError:
                  if not args.no_browser:
                      open_app_window(url, w, h)
                  return
              srv.daemon_threads = True
              srv.request_queue_size = 8
              if not args.no_browser:
                  threading.Timer(0.6, lambda: open_app_window(url, w, h)).start()

              if FROZEN and not args.no_browser:
                  def _watch_ui():
                      start_ts = time.time()
                      while True:
                          time.sleep(2.0)
                          now = time.time()
                          if Handler.ever_connected_ui:
                              if now - Handler.last_heartbeat > 8.0:
                                  os._exit(0)
                          elif now - start_ts > 45.0:
                              os._exit(0)
                  threading.Thread(target=_watch_ui, daemon=True).start()

              try:
                  srv.serve_forever()
              except KeyboardInterrupt:
                  print("\\n已停止")'''
          new_main_tail = textwrap.dedent(new_main_tail)
          assert old_main_tail in src, "old_main_tail not found"
          src = src.replace(old_main_tail, new_main_tail, 1)
          assert "/api/heartbeat" in src and "_watch_ui" in src
          py_path.write_text(src, encoding="utf-8")

          spec = '''# -*- mode: python ; coding: utf-8 -*-
          import sys

          a = Analysis(
              ['artex_console.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('icon.ico', '.'),
                  ('config.example.toml', '.'),
              ],
              hiddenimports=[],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=['tkinter', 'pydoc'],
              noarchive=False,
          )

          pyz = PYZ(a.pure, a.zipped_data)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.datas,
              [],
              name='ARTEX-Controller',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=False,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
              icon='icon.ico' if sys.platform == 'win32' else None,
          )
          '''
          pathlib.Path("artex_console.spec").write_text(textwrap.dedent(spec).lstrip(), encoding="utf-8")

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file EXE
        run: |
          python -m PyInstaller --clean --noconfirm artex_console.spec

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTEX-Controller-Windows-EXE
          path: dist/ARTEX-Controller.exe
          retention-days: 90

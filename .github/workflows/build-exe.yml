name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Prepare PyInstaller spec and frozen support
        shell: python
        run: |
          import pathlib, textwrap

          py_path = pathlib.Path("artex_console.py")
          src = py_path.read_text(encoding="utf-8")

          if "RESOURCE_DIR = getattr(sys," not in src:
              src = src.replace(
                  'HERE = os.path.dirname(os.path.abspath(__file__))',
                  'FROZEN = bool(getattr(sys, "frozen", False))\n'
                  'HERE = (os.path.dirname(os.path.abspath(sys.executable)) if FROZEN\n'
                  '        else os.path.dirname(os.path.abspath(__file__)))\n'
                  'RESOURCE_DIR = getattr(sys, "_MEIPASS", HERE)',
                  1,
              )
              src = src.replace(
                  'with open(os.path.join(HERE, "icon.ico"), "rb") as f:',
                  'with open(os.path.join(RESOURCE_DIR, "icon.ico"), "rb") as f:',
                  1,
              )
              src = src.replace(
                  '    _CONFIG_PATH = os.path.abspath(args.config)\n    cfg = load_config(args.config)',
                  '    _CONFIG_PATH = os.path.abspath(args.config)\n'
                  '    if FROZEN and not os.path.isfile(_CONFIG_PATH):\n'
                  '        example = os.path.join(RESOURCE_DIR, "config.example.toml")\n'
                  '        if os.path.isfile(example):\n'
                  '            shutil.copyfile(example, _CONFIG_PATH)\n'
                  '            print("已生成配置文件：%s（可直接在界面里填写账号密码）" % _CONFIG_PATH)\n'
                  '    cfg = load_config(args.config)',
                  1,
              )
              py_path.write_text(src, encoding="utf-8")

          spec = '''# -*- mode: python ; coding: utf-8 -*-
          import sys

          a = Analysis(
              ['artex_console.py'],
              pathex=[],
              binaries=[],
              datas=[
                  ('icon.ico', '.'),
                  ('config.example.toml', '.'),
              ],
              hiddenimports=[],
              hookspath=[],
              hooksconfig={},
              runtime_hooks=[],
              excludes=['tkinter', 'pydoc'],
              noarchive=False,
          )

          pyz = PYZ(a.pure, a.zipped_data)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.datas,
              [],
              name='ARTEX-Controller',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=False,
              console=True,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
              icon='icon.ico' if sys.platform == 'win32' else None,
          )
          '''
          pathlib.Path("artex_console.spec").write_text(textwrap.dedent(spec).lstrip(), encoding="utf-8")

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build single-file EXE
        run: |
          python -m PyInstaller --clean --noconfirm artex_console.spec

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTEX-Controller-Windows-EXE
          path: dist/ARTEX-Controller.exe
          retention-days: 90

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write Native C++ Source
        shell: python
        run: |
          import base64, zlib, pathlib
          pathlib.Path("native").mkdir(exist_ok=True)
          zb64 = ""
          pathlib.Path("native/main.cpp").write_bytes(zlib.decompress(base64.b64decode(zb64)))
          pathlib.Path("native/app.rc").write_text("1 ICON \"../icon.ico\"\n", encoding="utf-8")

          bat = '''@echo off
          mkdir build_native 2>nul
          mkdir dist 2>nul
          curl.exe -sSL "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45" -o build_native\webview2.zip
          tar -xf build_native\webview2.zip -C build_native

          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"

          rc.exe /nologo /fo build_native\app.res native\app.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /utf-8 /EHsc /O2 /MT /I "build_native\build\native\include" native\main.cpp build_native\app.res "build_native\build\native\x64\WebView2LoaderStatic.lib" user32.lib gdi32.lib shell32.lib shlwapi.lib ole32.lib advapi32.lib /link /SUBSYSTEM:WINDOWS /OUT:dist\ARTEX-Controller.exe
          if errorlevel 1 exit /b 1
          '''
          import textwrap
          pathlib.Path("build_native_ci.bat").write_text(textwrap.dedent(bat).lstrip(), encoding="utf-8")

      - name: Compile Native C++ EXE
        shell: cmd
        run: call build_native_ci.bat

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARTEX-Controller-Windows-EXE
          path: dist/ARTEX-Controller.exe
          retention-days: 90

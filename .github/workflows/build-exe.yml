      - name: Download WebView2 SDK & Compile Native C++ EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build_native, dist | Out-Null
          curl.exe -sSL "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2792.45" -o build_native/webview2.zip
          Expand-Archive -Path build_native/webview2.zip -DestinationPath build_native/wv2 -Force

          rc.exe /nologo /fo build_native/app.res native/app.rc
          cl.exe /nologo /utf-8 /EHsc /O2 /MT `
            /I "build_native/wv2/build/native/include" `
